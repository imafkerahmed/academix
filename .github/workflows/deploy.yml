name: Deploy Academix

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 1: Build & Push the Next.js App
      - name: Build and Push App
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/academix-app:latest
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=https://academixdb.codix.site
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Configuration and Restart
        run: |
          # Copy the latest docker-compose.yml to your data folder
          cp docker-compose.yml '/DATA/Web Projects/Academix/docker-compose.yml'

          cd '/DATA/Web Projects/Academix'
          docker compose pull
          docker compose down --remove-orphans
          docker compose up -d --no-build
          docker image prune -f
