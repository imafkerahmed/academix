name: Deploy Academix

on:
  push:
    branches:
      - main

# Opt-in to Node.js 24 for all actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 1: Build & Push the Next.js App
      - name: Build and Push App
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/academix-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 2: Build & Push Galene (Video)
      - name: Build and Push Galene
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/galene/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/academix-galene:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: build
    steps:
      - name: Pull and Restart Services
        run: |
          cd '/DATA/Web Projects/Academix'
          sudo docker compose pull
          sudo docker compose up -d
          sudo docker image prune -f
