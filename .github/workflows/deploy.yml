name: Deploy Academix

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 1: Build & Push the Next.js App
      - name: Build and Push App
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/academix-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 2: Build & Push Galene (Video)
      - name: Build and Push Galene
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/galene/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/academix-galene:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Install cloudflared
        run: |
          sudo mkdir -p --mode=0755 /usr/local/bin
          curl -L --output /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_command: /usr/local/bin/cloudflared access ssh --hostname %h
          script: |
            cd "/DATA/Web Projects/Academix"
            # This pulls BOTH academix-app and academix-galene
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f
